name: Build LaTeX Presentation

on:
  push:
    paths:
      - 'presentation.tex'
  workflow_dispatch:

jobs:
  build_latex:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Add this to grant write permissions
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: presentation.tex
          args: "-pdf -interaction=nonstopmode -halt-on-error"

      - name: Commit and Push PDF
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add presentation.pdf
          git commit -m "chore: Update compiled PDF [skip ci]" || echo "No changes to commit"
          git push origin main
